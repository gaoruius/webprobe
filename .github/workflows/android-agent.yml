name: Android agent runs

# By hand only: every run calls the model and costs money (Haiku, 60 steps: about $0.02 a run).
# Download the agent-runs artifact into agent/runs/ and score it with npm run eval.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "How many runs"
        default: "3"
      model:
        description: "Model"
        default: claude-haiku-5-5
      max_steps:
        description: "Step budget"
        default: "60"
      bugs:
        description: "Bugs on in the app: all, none, or ids"
        default: all

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build the app
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
          WEBPROBE_MODEL: ${{ inputs.model }}
          WEBPROBE_MAX_STEPS: ${{ inputs.max_steps }}
          WEBPROBE_ANDROID_BUGS: ${{ inputs.bugs }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: android/agent-ci.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-runs
          path: agent/runs/
