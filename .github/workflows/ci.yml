name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: "Write new visual baselines and upload them as an artifact (commit them after review)"
        type: boolean
        default: false

jobs:
  # The scorer and the agent's page tracking. No API keys: nothing here calls a model.
  agent-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The gate: every regression test passes on the clean shop.
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buggyshop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: buggyshop/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:regression
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: regression-report
          path: buggyshop/test-results/

  # The other half: with every bug on, every test should fail. A test that passes here no
  # longer catches its bug, so this job fails.
  regression-catches-bugs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buggyshop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: buggyshop/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:regression:buggy || true
      - name: Every test must have failed
        run: |
          passed=$(jq '.stats.expected' test-results/results.json)
          failed=$(jq '.stats.unexpected' test-results/results.json)
          echo "passed with bugs on: $passed, failed: $failed"
          test "$passed" -eq 0 && test "$failed" -gt 0

  # Screenshots of the main pages against the committed baselines. Runs in Playwright's own image
  # so fonts and rendering match the machine the baselines were made on.
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    defaults:
      run:
        working-directory: buggyshop
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Compare with baselines
        if: ${{ !inputs.update_visual_baselines }}
        run: npm run test:visual
      - name: Write new baselines
        if: ${{ inputs.update_visual_baselines }}
        run: npm run test:visual:update
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.update_visual_baselines }}
        with:
          name: visual-baselines-linux
          path: buggyshop/tests/visual/__screenshots__/linux/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs
          path: buggyshop/test-results/

  # Each visual bug on its own must break exactly the screenshots it should, and no others.
  visual-catches-bug:
    if: ${{ !inputs.update_visual_baselines }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    defaults:
      run:
        working-directory: buggyshop
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: White-on-white prices change only the home page, at both sizes
        run: |
          NEXT_PUBLIC_BUGS=visual-price-invisible npm run test:visual || true
          node scripts/check-visual.mjs desktop/home mobile/home
      - name: The hidden cart link changes every page at phone size, none at desktop size
        run: |
          rm -rf test-results
          NEXT_PUBLIC_BUGS=mobile-cart-link-hidden npm run test:visual || true
          node scripts/check-visual.mjs "mobile/*"

  # The iOS app on a macOS runner (free for public repositories): build it and the XCUITest
  # driver, then reproduce its bugs through ios-mcp. No model calls, no API key.
  ios:
    if: ${{ !inputs.update_visual_baselines }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: ios/ci.sh

  # The Android app on a Linux runner's emulator (KVM; free for public repositories): build it with
  # Gradle, then reproduce its bugs through android-mcp. No model calls, no API key.
  android:
    if: ${{ !inputs.update_visual_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build the app
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: android/ci.sh
