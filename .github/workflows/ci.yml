name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The scorer and the agent's page tracking. No API keys: nothing here calls a model.
  agent-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The gate: every regression test passes on the clean shop.
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buggyshop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: buggyshop/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:regression
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-report
          path: buggyshop/test-results/

  # The other half: with every bug on, every test should fail. A test that passes here no
  # longer catches its bug, so this job fails.
  regression-catches-bugs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buggyshop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: buggyshop/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:regression:buggy || true
      - name: Every test must have failed
        run: |
          passed=$(jq '.stats.expected' test-results/results.json)
          failed=$(jq '.stats.unexpected' test-results/results.json)
          echo "passed with bugs on: $passed, failed: $failed"
          test "$passed" -eq 0 && test "$failed" -gt 0
